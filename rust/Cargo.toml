[package]
name = "shopsess"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shopsess"
path = "src/main.rs"

[dependencies]
hashbrown = "0.15"
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "54", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
